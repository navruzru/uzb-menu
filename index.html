<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Узбекская кухня</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0905;--text:#fbf1e4;--muted:#c3a98f;--dim:#8a705a;
  --gold:#ffc27a;--c1:#f0a95a;--c2:#b8642c;
  --glass:linear-gradient(160deg,rgba(214,140,74,.30),rgba(120,64,30,.22) 55%,rgba(60,30,14,.35));
  --glassB:rgba(255,214,170,.22);
  --grad:linear-gradient(135deg,#ffcf8a,#f0a95a 45%,#c06a2e);
  --disp:"Unbounded","Manrope",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--text);font:15px/1.35 "Manrope",-apple-system,system-ui,sans-serif;padding-bottom:150px;min-height:100vh;
  background:
    radial-gradient(90% 45% at 15% 0%,rgba(196,110,45,.55),rgba(196,110,45,0) 70%),
    radial-gradient(70% 40% at 100% 30%,rgba(255,170,90,.18),rgba(255,170,90,0) 70%),
    radial-gradient(80% 50% at 50% 105%,rgba(214,120,50,.35),rgba(214,120,50,0) 70%),
    linear-gradient(180deg,#2a170b 0%,#140b06 45%,#0f0905 100%);
  background-attachment:fixed}
button{font:inherit;cursor:pointer}

/* hero */
.hero{padding:26px 20px 8px}
.hero h1{font-family:var(--disp);font-weight:800;font-size:31px;line-height:1.05;margin:0;letter-spacing:-.01em}
.hero h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{font-weight:700;margin-top:10px;font-size:14px}
.hero .meta{color:var(--muted);font-size:13px;margin-top:4px}
.perks{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:16px -20px 0;padding:0 20px}
.perks::-webkit-scrollbar{display:none}
.perk{flex:none;border-radius:16px;padding:10px 13px;background:var(--glass);border:1px solid var(--glassB);font-weight:700;font-size:13px}
.perk small{display:block;color:var(--muted);font-weight:600;font-size:11.5px;margin-top:2px}
.perk.hot{background:var(--grad);color:#2a1408;border:0}
.perk.hot small{color:rgba(42,20,8,.7)}

/* tabs */
nav{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:14px 16px 12px;scrollbar-width:none;
  background:linear-gradient(180deg,rgba(15,9,5,.97) 72%,rgba(15,9,5,0))}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:1px solid var(--glassB);background:rgba(255,220,180,.06);color:var(--text);border-radius:14px;padding:9px 14px;font-size:14px;font-weight:700;transition:.2s}
nav button.on{background:#fbf1e4;color:#3a1d0c;border-color:transparent}

h2{font-family:var(--disp);font-weight:700;font-size:20px;margin:18px 18px 12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 14px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}

/* card with folder-tab label, like the reference */
.card{position:relative;padding-top:14px}
.card .tab{position:absolute;right:10px;top:0;z-index:2;background:#fbf1e4;color:#3a1d0c;font-weight:800;font-size:11.5px;
  border-radius:10px 10px 0 0;padding:4px 10px 6px;display:none}
.card .tab.on{display:block}
.card .in{border-radius:22px;overflow:hidden;background:var(--glass);border:1px solid var(--glassB);display:flex;flex-direction:column;height:100%;position:relative}
.card .in:before{content:"";position:absolute;inset:0;border-radius:22px;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,230,200,.14),rgba(255,230,200,0) 35%)}
.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.card .b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:9px;flex:1}
.card .t{font-size:14px;font-weight:700;flex:1;line-height:1.25}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:34px}
.price{font-family:var(--disp);font-weight:700;font-size:14px;white-space:nowrap}
.add{border:0;background:#fbf1e4;color:#3a1d0c;font-weight:800;border-radius:12px;width:36px;height:36px;font-size:21px;line-height:1}
.qty{display:flex;align-items:center;gap:2px;background:rgba(15,9,5,.45);border:1px solid var(--glassB);border-radius:13px;padding:2px}
.qty button{width:27px;height:30px;border-radius:10px;border:0;background:transparent;color:var(--text);font-size:18px;line-height:1}
.qty button:last-child{background:#fbf1e4;color:#3a1d0c;font-weight:800}
.qty span{min-width:14px;text-align:center;font-weight:800}

/* delivery progress */
.dprog{border-radius:18px;padding:12px 14px;background:var(--glass);border:1px solid var(--glassB)}
.dprog .lbl{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:13.5px}
.dprog .lbl b{font-family:var(--disp);color:var(--gold);font-size:14px}
.dprog.ok .lbl b{color:#9fe3ad}
.track{height:8px;border-radius:8px;background:rgba(15,9,5,.5);margin-top:9px;overflow:hidden}
.fill{height:100%;width:0;border-radius:8px;background:var(--grad);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.dprog.ok .fill{background:linear-gradient(90deg,#6fbf83,#a8ebb4)}

/* bottom bar */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 14px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(15,9,5,0),rgba(15,9,5,.96) 28%);display:none}
#bar .dprog{margin-bottom:10px}
#barBtn{width:100%;border:0;border-radius:20px;padding:18px 20px;background:#fbf1e4;color:#3a1d0c;font-size:16px;font-weight:800;
  display:flex;justify-content:space-between;align-items:center;box-shadow:0 14px 40px -12px rgba(240,169,90,.6)}
#barBtn .n{font-family:var(--disp);font-size:15px}

/* sheet */
#sheet{position:fixed;inset:0;z-index:20;overflow-y:auto;display:none;padding:18px 16px 170px;background:inherit;
  background:radial-gradient(90% 40% at 20% 0%,rgba(196,110,45,.5),rgba(196,110,45,0) 70%),linear-gradient(180deg,#24140a,#0f0905 50%)}
#sheet h3{font-family:var(--disp);font-weight:800;margin:14px 0 14px;font-size:28px;line-height:1.05}
#sheet h3 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.back{border:1px solid var(--glassB);background:rgba(255,220,180,.06);color:var(--text);font-size:14px;font-weight:700;padding:8px 13px;border-radius:12px}
.box{border-radius:22px;padding:4px 12px;margin-bottom:12px;background:var(--glass);border:1px solid var(--glassB)}
.line{display:flex;align-items:center;padding:10px 0;gap:10px;border-bottom:1px solid rgba(255,214,170,.12)}
.line:last-child{border-bottom:0}
.line img{width:54px;height:54px;border-radius:14px;object-fit:cover}
.line .n{flex:1;font-weight:700;font-size:14px}
.line .n small{display:block;color:var(--gold);font-family:var(--disp);font-weight:700;margin-top:4px;font-size:12.5px}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:10px 4px 14px}
.tot span:first-child{font-weight:700;color:var(--muted)}
.tot span:last-child{font-family:var(--disp);font-weight:800;font-size:24px}
.sec{color:var(--muted);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;margin:18px 4px 9px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{position:relative;border:1px solid var(--glassB);background:rgba(255,220,180,.05);color:var(--text);border-radius:18px;padding:13px;text-align:left;transition:.2s}
.opt b{display:block;font-size:15px;font-weight:800}
.opt span{display:block;color:var(--muted);font-size:12px;margin-top:4px;font-weight:600}
.opt.on{background:var(--glass);border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.opt.lock span{color:var(--gold);font-weight:800}
.opt .lockTag{position:absolute;right:10px;top:-10px;background:var(--grad);color:#2a1408;font-weight:800;font-size:11px;border-radius:8px;padding:3px 8px;display:none}
.opt.lock .lockTag{display:block}
.shake{animation:sh .45s}
@keyframes sh{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
input,textarea{width:100%;border:1px solid var(--glassB);background:rgba(255,220,180,.05);color:var(--text);border-radius:16px;padding:14px;font:inherit;font-weight:600;margin-bottom:9px;outline:none}
input::placeholder,textarea::placeholder{color:var(--dim)}
input:focus,textarea:focus{border-color:var(--gold)}
.note{color:var(--muted);font-size:12.5px;margin-top:6px;line-height:1.45}
.note a{color:var(--gold)}
.err{color:#ff9f80;font-size:13px;margin-top:6px;min-height:18px;font-weight:700}

#toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-160%);z-index:50;width:max-content;max-width:92vw;text-align:center;
  background:linear-gradient(160deg,#6a3a18,#3a200d);border:1px solid rgba(255,200,140,.45);color:var(--text);border-radius:18px;padding:13px 18px;
  font-weight:800;font-size:14px;box-shadow:0 16px 40px -10px rgba(0,0,0,.7);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#toast.on{transform:translate(-50%,0)}
</style>
</head>
<body>
<section class="hero">
  <h1>Выберите<br><em>вкусный</em> обед</h1>
  <div class="sub" id="sub">Узбекская кухня · большие порции</div>
  <div class="meta" id="meta"></div>
  <div class="perks">
    <div class="perk hot" id="perkDel">🚗 Доставка<small id="perkDelS">от 1 000 ₽</small></div>
    <div class="perk">🛍 Самовывоз<small>без минимума</small></div>
    <div class="perk">💵 Оплата<small>при получении</small></div>
  </div>
</section>
<nav id="nav"></nav>
<main id="menu"></main>

<div id="bar">
  <div class="dprog" id="barProg"><div class="lbl"><span id="barProgT"></span><b id="barProgV"></b></div><div class="track"><div class="fill" id="barFill"></div></div></div>
  <button id="barBtn"><span id="barL"></span><span class="n" id="barR"></span></button>
</div>

<section id="sheet">
  <button class="back" id="back">‹ Меню</button>
  <h3>Ваш<br><em>заказ</em></h3>
  <div class="box" id="lines"></div>
  <div class="tot"><span>Итого</span><span id="total"></span></div>
  <div class="dprog" id="sheetProg"><div class="lbl"><span id="sheetProgT"></span><b id="sheetProgV"></b></div><div class="track"><div class="fill" id="sheetFill"></div></div></div>

  <div class="sec">Как получить</div>
  <div class="seg">
    <button class="opt on" id="hPick"><b>🛍 Самовывоз</b><span id="pickNote"></span></button>
    <button class="opt" id="hDel"><i class="lockTag" id="lockTag"></i><b>🚗 Доставка</b><span id="delNote"></span></button>
  </div>
  <div id="addrBox" style="display:none"><div class="sec">Адрес</div><input id="addr" maxlength="300" placeholder="Дом, корпус, подъезд, квартира"></div>
  <div class="sec">Контакты</div>
  <input id="phone" type="tel" inputmode="tel" placeholder="Телефон: +7 ___ ___-__-__" maxlength="25">
  <textarea id="comment" rows="2" maxlength="300" placeholder="Комментарий: без лука, к 19:30…"></textarea>
  <div class="err" id="err"></div>
  <div class="note">Телефон и адрес нужны только для выполнения заказа и удаляются после него. <a href="privacy.html">Политика обработки данных</a></div>
</section>
<div id="toast"></div>

<script>
const T = window.Telegram && Telegram.WebApp;
const tg = T && T.initData ? T : null;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#2a170b'); tg.setBackgroundColor('#0f0905'); } catch (e) {} }
const rub = n => n.toLocaleString('ru-RU') + ' ₽';
const $ = id => document.getElementById(id);
let M, items = {}, cart = {}, how = 'pickup';
try { cart = JSON.parse(localStorage.getItem('cart') || '{}'); } catch (e) {}
const saveCart = () => { try { localStorage.setItem('cart', JSON.stringify(cart)); } catch (e) {} };
const haptic = t => { try { tg && tg.HapticFeedback && (t === 'err' ? tg.HapticFeedback.notificationOccurred('error') : tg.HapticFeedback.impactOccurred('light')); } catch (e) {} };
let toastT;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2800); }
function shake(el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

fetch('menu.json').then(r => r.json()).then(m => { M = m; init(); });

function init() {
  $('sub').textContent = `${M.title} · большие порции`;
  $('meta').textContent = `📍 ${M.address} · 🕐 ${M.hours}`;
  $('perkDelS').textContent = M.delivery.enabled ? `от ${rub(M.delivery.min_sum)}` : 'пока нет';
  const nav = $('nav'), menu = $('menu');
  M.categories.forEach((c, i) => {
    c.items.forEach(it => items[it.id] = it);
    const b = document.createElement('button');
    b.textContent = c.title; b.onclick = () => window.scrollTo({top: $('c' + i).offsetTop - 64, behavior: 'smooth'});
    nav.appendChild(b);
    const sec = document.createElement('section');
    sec.id = 'c' + i;
    sec.innerHTML = `<h2>${c.title}</h2><div class="grid">${c.items.map(card).join('')}</div>`;
    menu.appendChild(sec);
  });
  for (const id in cart) if (!items[id]) delete cart[id];
  menu.onclick = e => { const t = e.target.closest('[data-a]'); if (t) change(t.dataset.id, t.dataset.a); };
  const io = new IntersectionObserver(es => es.forEach(en => {
    if (en.isIntersecting) [...nav.children].forEach((b, i) => b.classList.toggle('on', 'c' + i === en.target.id));
  }), {rootMargin: '-40% 0px -55% 0px'});
  document.querySelectorAll('main section').forEach(s => io.observe(s));
  Object.keys(items).forEach(paint); updBar();
}

function card(it) {
  return `<div class="card"><span class="tab" id="tb_${it.id}"></span><div class="in">
    ${it.img ? `<img src="${it.img}" alt="" loading="lazy">` : '<img alt="">'}
    <div class="b"><div class="t">${it.title}</div><div class="row"><span class="price">${rub(it.price)}</span><span id="q_${it.id}"></span></div></div></div></div>`;
}
function ctrl(id) {
  const q = cart[id] || 0;
  return q ? `<span class="qty"><button data-a="-" data-id="${id}">−</button><span>${q}</span><button data-a="+" data-id="${id}">+</button></span>`
           : `<button class="add" data-a="+" data-id="${id}">+</button>`;
}
function paint(id) {
  const el = $('q_' + id); if (el) el.innerHTML = ctrl(id);
  const tb = $('tb_' + id); if (tb) { tb.textContent = `в корзине: ${cart[id] || 0}`; tb.classList.toggle('on', !!cart[id]); }
}
function change(id, a) {
  const before = total();
  cart[id] = (cart[id] || 0) + (a === '+' ? 1 : -1);
  if (cart[id] <= 0) delete cart[id];
  saveCart(); haptic(); paint(id);
  const min = M.delivery.min_sum;
  if (M.delivery.enabled && before < min && total() >= min) toast('🎉 Доставка доступна!');
  if (sheetOpen()) renderSheet(); else updBar();
}
const total = () => Object.entries(cart).reduce((s, [id, q]) => s + items[id].price * q, 0);
const count = () => Object.values(cart).reduce((s, q) => s + q, 0);
const sheetOpen = () => $('sheet').style.display === 'block';

function prog(p) {
  const d = M.delivery, box = $(p + 'Prog');
  if (!d.enabled) { box.style.display = 'none'; return; }
  box.style.display = '';
  const left = d.min_sum - total(), ok = left <= 0;
  box.classList.toggle('ok', ok);
  $(p + 'ProgT').textContent = ok ? '🚗 Доставка доступна' : `🚗 Доставка от ${rub(d.min_sum)} — осталось`;
  $(p + 'ProgV').textContent = ok ? '✓' : rub(left);
  $(p + 'Fill').style.width = Math.min(100, total() / d.min_sum * 100) + '%';
}
function updBar() {
  const n = count(), open = sheetOpen();
  $('bar').style.display = n || open ? 'block' : 'none';
  $('barProg').style.display = open ? 'none' : '';
  if (!open) prog('bar');
  $('barL').textContent = open ? 'Оформить заказ' : `Корзина · ${n}`;
  $('barR').textContent = rub(total());
}
$('barBtn').onclick = () => sheetOpen() ? submit() : openSheet();

function openSheet() {
  if (!count()) return;
  $('sheet').style.display = 'block'; $('sheet').scrollTop = 0;
  if (tg && tg.BackButton) tg.BackButton.show();
  renderSheet();
}
function closeSheet() {
  $('sheet').style.display = 'none';
  if (tg && tg.BackButton) tg.BackButton.hide();
  Object.keys(items).forEach(paint); updBar();
}
$('back').onclick = closeSheet;
if (tg && tg.BackButton) tg.BackButton.onClick(closeSheet);

function renderSheet() {
  if (!count()) return closeSheet();
  $('lines').innerHTML = Object.entries(cart).map(([id, q]) => {
    const it = items[id];
    return `<div class="line">${it.img ? `<img src="${it.img}" alt="">` : ''}<div class="n">${it.title}<small>${rub(it.price * q)}</small></div>${ctrl(id)}</div>`;
  }).join('');
  $('total').textContent = rub(total());
  prog('sheet');
  const d = M.delivery, left = d.min_sum - total(), ok = d.enabled && left <= 0;
  if (how === 'delivery' && !ok) how = 'pickup';
  $('hPick').classList.toggle('on', how === 'pickup');
  $('hDel').classList.toggle('on', how === 'delivery');
  $('hDel').classList.toggle('lock', !ok);
  $('lockTag').textContent = `от ${rub(d.min_sum)}`;
  $('delNote').textContent = !d.enabled ? 'Сейчас недоступна' : ok ? d.zone : `🔒 добавьте ещё ${rub(left)}`;
  $('pickNote').textContent = M.address;
  $('addrBox').style.display = how === 'delivery' ? 'block' : 'none';
  updBar();
}
$('lines').onclick = e => { const t = e.target.closest('[data-a]'); if (t) change(t.dataset.id, t.dataset.a); };
$('hPick').onclick = () => { how = 'pickup'; $('err').textContent = ''; renderSheet(); };
$('hDel').onclick = () => {
  const d = M.delivery, left = d.min_sum - total();
  if (!d.enabled) return toast('Доставка сейчас недоступна');
  if (left > 0) {
    haptic('err'); shake($('hDel')); shake($('sheetProg'));
    return toast(`🚗 Доставка — от ${rub(d.min_sum)}. Добавьте ещё на ${rub(left)}`);
  }
  how = 'delivery'; renderSheet();
};

const API = 'https://worker-production-6355a0a9.up.railway.app/order';
let sending = false;
async function submit() {
  if (sending) return;
  const phone = $('phone').value.trim(), addr = $('addr').value.trim();
  const fail = m => { $('err').textContent = m; haptic('err'); toast(m); };
  if ((phone.match(/\d/g) || []).length < 10) return fail('Укажите номер телефона полностью');
  if (how === 'delivery' && addr.length < 5) return fail('Укажите адрес доставки');
  if (!tg) return fail('Откройте меню через бота в Telegram');
  const order = {v: 1, cart, how, address: how === 'delivery' ? addr : '', phone, comment: $('comment').value.trim()};
  sending = true; $('barL').textContent = 'Отправляем…';
  let r = null, j = {};
  try {
    r = await fetch(API, {method: 'POST', headers: {'Content-Type': 'application/json'},
                          body: JSON.stringify({initData: tg.initData, order})});
    j = await r.json().catch(() => ({}));
  } catch (e) { r = null; }
  if (r && r.ok && j.ok) {
    cart = {}; saveCart();
    try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
    tg.showAlert('✅ ' + j.text + '. Подтверждение придёт в чат с ботом.', () => tg.close());
    return;
  }
  if (r && j.error) { sending = false; updBar(); return fail(j.error); }
  try { tg.sendData(JSON.stringify(order)); cart = {}; saveCart(); }  // запасной путь: приложение открыто нижней кнопкой
  catch (e) { sending = false; updBar(); fail('Нет связи. Попробуйте ещё раз'); }
}
</script>
</body>
</html>
